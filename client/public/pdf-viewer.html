<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=3.0,user-scalable=yes">
<title>文档预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e5e7eb;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.toolbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin:8px;position:sticky;top:8px;z-index:10;flex-wrap:wrap;justify-content:center}
.toolbar button{border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;padding:6px 12px;color:#374151;touch-action:manipulation}
.toolbar button:active{background:#e5e7eb}
.toolbar button:disabled{opacity:.3}
.toolbar span{font-size:13px;color:#4b5563;min-width:60px;text-align:center}
#loading{display:flex;align-items:center;justify-content:center;height:200px;color:#6b7280;font-size:14px}
#loading .spinner{width:24px;height:24px;border:3px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
#error{display:none;padding:40px 20px;text-align:center;color:#ef4444;font-size:14px}
#error a{color:#2563eb;text-decoration:underline}
#container{width:100%;display:flex;justify-content:center;padding:4px 8px 16px;flex-direction:column;align-items:center}
canvas{max-width:100%;height:auto!important;box-shadow:0 2px 8px rgba(0,0,0,.15);border-radius:4px;margin-bottom:4px}
.page-label{font-size:12px;color:#9ca3af;margin-top:4px}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>正在加载文档...</span>
</div>
<div id="error">文档加载失败，<a id="directLink" href="#" style="color:#2563eb">点击查看</a></div>

<div class="toolbar" id="toolbar">
  <button id="prevBtn">上一页</button>
  <span id="pageInfo"></span>
  <button id="nextBtn">下一页</button>
  <button id="zoomOutBtn">-</button>
  <button id="zoomInBtn">+</button>
</div>

<div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.min.mjs';

const params = new URLSearchParams(location.search);
const pdfUrl = params.get('url');

const container = document.getElementById('container');
const toolbar = document.getElementById('toolbar');
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');
const pageInfo = document.getElementById('pageInfo');
const directLink = document.getElementById('directLink');

let pdfDoc = null;
let currentPage = 1;
let numPages = 0;
let scale = 1.3;
let canvasArr = [];

if (!pdfUrl) {
  loadingEl.style.display = 'none';
  errorEl.style.display = 'block';
} else {
  directLink.href = pdfUrl;
  loadPDF();
}

async function loadPDF() {
  try {
    const loadingTask = pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false });
    pdfDoc = await loadingTask.promise;
    numPages = pdfDoc.numPages;
    loadingEl.style.display = 'none';
    toolbar.style.display = 'flex';
    
    container.innerHTML = '';
    canvasArr = [];
    for (let i = 1; i <= numPages; i++) {
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'width:100%;display:flex;flex-direction:column;align-items:center;margin-bottom:8px';
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'max-width:100%;height:auto!important;box-shadow:0 2px 8px rgba(0,0,0,.15);border-radius:4px';
      const label = document.createElement('span');
      label.className = 'page-label';
      label.textContent = (i) + ' / ' + numPages;
      wrapper.appendChild(canvas);
      wrapper.appendChild(label);
      container.appendChild(wrapper);
      canvasArr.push({ canvas, pageNum: i });
    }
    await renderAllPages();
    updatePageInfo();
  } catch (err) {
    console.error('PDF load error:', err.message, err);
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
  }
}

async function renderAllPages() {
  const containerWidth = container.clientWidth || 600;
  const pixelRatio = window.devicePixelRatio || 1;
  for (const { canvas, pageNum: pn } of canvasArr) {
    try {
      const page = await pdfDoc.getPage(pn);
      const viewport = page.getViewport({ scale: 1 });
      const autoScale = (containerWidth - 16) / viewport.width;
      const finalScale = Math.max(0.3, Math.min(autoScale, scale));
      const sv = page.getViewport({ scale: finalScale * pixelRatio });
      canvas.width = Math.floor(sv.width);
      canvas.height = Math.floor(sv.height);
      canvas.style.width = Math.floor(sv.width / pixelRatio) + 'px';
      canvas.style.height = Math.floor(sv.height / pixelRatio) + 'px';
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: sv }).promise;
    } catch (err) {
      console.error('Page render error:', pn, err);
    }
  }
}

function updatePageInfo() {
  pageInfo.textContent = currentPage + ' / ' + numPages;
  if (canvasArr[currentPage - 1]) {
    canvasArr[currentPage - 1].canvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

document.getElementById('prevBtn').onclick = () => { if (currentPage > 1) { currentPage--; updatePageInfo(); } };
document.getElementById('nextBtn').onclick = () => { if (currentPage < numPages) { currentPage++; updatePageInfo(); } };
document.getElementById('zoomInBtn').onclick = async () => { if (scale < 3) { scale += 0.2; await renderAllPages(); } };
document.getElementById('zoomOutBtn').onclick = async () => { if (scale > 0.5) { scale -= 0.2; await renderAllPages(); } };

let touchY = 0;
document.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; });
document.addEventListener('touchend', e => {
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 80) {
    if (dy > 0 && currentPage < numPages) { currentPage++; updatePageInfo(); }
    else if (dy < 0 && currentPage > 1) { currentPage--; updatePageInfo(); }
  }
});
</script>
</body>
</html>
